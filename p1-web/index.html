<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova da Loja de Informática</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/normalize.css">
</head>
<body>  
    <header class="cabecalho">
        <h1 class="cabecalho__titulo">Prova da Loja de Informática</h1>
        <nav class="cabecalho__nav">
            <a href="#">Home</a>
            <a href="#">Produtos</a>
            <a href="#">Contato</a>
        </nav>
        <div class="cabecalho__carrinho">
            <a href="carrinho.html">
                <span id="carrinho-contagem">0</span>
                <img src="img/cart-icon.png" alt="Carrinho de Compras">
            </a>
        </div>
    </header>
    <main>
        <section class="oferta">
            <h1>Ofertas Relâmpago</h1>
            <article class="oferta__card">
                <img class="oferta__img" src="img/mouse.jpg" alt="Mouse">
                <h2 class="oferta__titulo">Mouse</h2>
                <p class="oferta__preco">R$ 40,00</p>
                <button onclick="adicionaAoCarrinho('Mouse', 40)">Adicionar ao Carrinho</button>
            </article>
            <article class="oferta__card">
                <img class="oferta__img" src="img/passadorSlide.jpg" alt="PassadorSlide">
                <h2 class="oferta__titulo">Passador Slide</h2>
                <p class="oferta__preco">R$ 280,00</p>
                <button onclick="adicionaAoCarrinho('PassadorSlide', 280)">Adicionar ao Carrinho</button>
            </article>
        </section>

        <section class="produto">
            <article class="produto__card">
                <img class="produto__img" src="img/notebook.jpg" alt="Notebook">
                <h2 class="produto__titulo">Notebook</h2>
                <p class="produto__preco">R$ 3.500,00</p>
                <button onclick="adicionaAoCarrinho('Notebook', 3500)">Adicionar ao Carrinho</button>
            </article>
            <article class="produto__card">
                <img class="produto__img" src="img/teclado.jpg" alt="Teclado">
                <h2 class="produto__titulo">Teclado</h2>
                <p class="produto__preco">R$ 150,00</p>
                <button onclick="adicionaAoCarrinho('Teclado', 150)">Adicionar ao Carrinho</button>
            </article>
            <article class="produto__card">
                <img class="produto__img" src="img/leitorBiometrico.jpg" alt="LeitorBiometrico">
                <h2 class="produto__titulo">Leitor Biométrico</h2>
                <p class="produto__preco">R$ 350,00</p>
                <button onclick="adicionaAoCarrinho('LeitorBiometrico', 350)">Adicionar ao Carrinho</button>
            </article>
            <article class="produto__card">
                <img class="produto__img" src="img/tablet.jpg" alt="Tablet">
                <h2 class="produto__titulo">Tablet</h2>
                <p class="produto__preco">R$ 2.350,00</p>
                <button onclick="adicionaAoCarrinho('Tablet', 2350)">Adicionar ao Carrinho</button>
            </article>
            <!-- Adicione mais produtos conforme necessário -->
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Minha Loja de Informática - Todos os direitos reservados</p>
    </footer>
    <script src="scripts/script.js"></script>
</body>
</html>
