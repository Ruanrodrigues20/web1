<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova da Loja de Informática</title>
    <link rel="stylesheet" type="text/css" href="./css/normalize.css" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
</head>

<body>
    <header>
        <h1>Prova da Loja de Informática</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Produtos</a>
            <a href="#">Contato</a>
        </nav>
        <div class="carrinho">
            <a href="carrinho.html">
                <span id="carrinho__contagem">0</span>
                <img src="./img/cart-icon.png" alt="Carrinho de Compras">
            </a>
        </div>
    </header>
    <main>
        <section class="produtos--promocional">
            <img src="img/ofertas_relampago.png" class="produtos--promocional__header-img">
            <section class="produtos--promocional__content">
                <article class="produtos--promocional__content__produto-card">
                    <img src="./img/mouse.jpg" alt="Mouse">
                    <h2>Mouse</h2>
                    <p class="produtos--promocional__content__produto-card__preco">R$ 40,00</p>
                    <div class="produtos--promocional__content__produto-card__desconto">
                        <p class="produtos--promocional__content__produto-card__desconto__porcento">20%</p>
                        <p class="produtos--promocional__content__produto-card__desconto__preco--antigo">R$ 50,00</p>
                    </div>
                    <button onclick="adicionaAoCarrinho('Mouse', 40)">Adicionar ao Carrinho</button>
                </article>

                <article class="produtos--promocional__content__produto-card">
                    <img src="./img/passador_slide.jpg" alt="PassadorSlide">
                    <h2>Passador Slide</h2>
                    <p class="produtos--promocional__content__produto-card__preco">R$ 280,00</p>
                    <div class="produtos--promocional__content__produto-card__desconto">
                        <p class="produtos--promocional__content__produto-card__desconto__porcento">20%</p>
                        <p class="produtos--promocional__content__produto-card__desconto__preco--antigo">R$ 350,00</p>
                    </div>
                    <button onclick="adicionaAoCarrinho('PassadorSlide', 280)">Adicionar ao Carrinho</button>
                </article>
            </section>
        </section>

        <section class="produtos">
            <article class="produtos__produto-card">
                <img src="./img/notebook.jpg" alt="Notebook">
                <h2>Notebook</h2>
                <p>R$ 3.500,00</p>
                <button onclick="adicionaAoCarrinho('Notebook', 3500)">Adicionar ao Carrinho</button>
            </article>
            <article class="produtos__produto-card">
                <img src="./img/teclado.jpg" alt="Teclado">
                <h2>Teclado</h2>
                <p>R$ 150,00</p>
                <button onclick="adicionaAoCarrinho('Teclado', 150)">Adicionar ao Carrinho</button>
            </article>
            <article class="produtos__produto-card">
                <img src="./img/leitor_biometrico.jpg" alt="LeitorBiometrico">
                <h2>Leitor Biométrico</h2>
                <p>R$ 350,00</p>
                <button onclick="adicionaAoCarrinho('LeitorBiometrico', 350)">Adicionar ao Carrinho</button>
            </article>
            <article class="produtos__produto-card">
                <img src="./img/tablet.jpg" alt="Tablet">
                <h2>Tablet</h2>
                <p>R$ 2.350,00</p>
                <button onclick="adicionaAoCarrinho('Tablet', 2350)">Adicionar ao Carrinho</button>
            </article>
            <!-- Adicione mais produtos conforme necessário -->
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Minha Loja de Informática - Todos os direitos reservados</p>
    </footer>
    <script src="./scripts/script.js"></script>
</body>

</html>
